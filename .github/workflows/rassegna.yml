name: Aggiorna rassegna stampa

on:
  schedule:
    # 3 volte al giorno - orari in UTC.
    # In estate (UTC+2): 07:00, 13:00, 19:00 ora italiana.
    # In inverno (UTC+1): 06:00, 12:00, 18:00 ora italiana.
    - cron: "0 5,11,17 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["generate.py", "topics.json"]

permissions:
  contents: write

concurrency:
  group: rassegna
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Genera la pagina
        run: python3 generate.py

      - name: Pubblica
        run: |
          git config user.name "rassegna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Rassegna del $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
            git push
          fi

